---
layout: default
---

<div class="blog-content {{page.containerClassOverrides}}">
    <h1>{{page.title}}</h1>
    <p class="tag-container">
        {% for tag in page.tags %}
        <span class="tag {{tag | downcase}}">[{{tag}}]</span>
        {% endfor %}
    </p>
    <p>{{ page.date | date_to_string }}</p>

    {{page.content}}

    {% include blog-prev-next.html %}
</div>
