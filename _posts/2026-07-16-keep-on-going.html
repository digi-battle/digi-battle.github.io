<p>
    Just a bit of fun.
</p>
<p>
    I saw a poster with this header-middle-footer layout and wanted to recreate it in CSS. 
</p>
<p>
    Remember to keep on going. Or don't.
</p>

<head>    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bungee&display=swap" rel="stylesheet">
    <style>
        :root {
            --green: #0b2b00;
            --pink: #ffb6bd;
            --size: 30px;
        }

        * {
            transition: all .2s ease-in-out;
        }

        .poster__title, .poster__subtitle {
            padding: 0;
            margin: 0 !important;
            word-spacing: normal;
        }

        .poster__title {
            font-size: 36px;
        }

        .poster__subtitle {
            font-size: 72px;
        }

        .poster-wrapper {
            font-family: "Bungee", sans-serif;
            color: var(--green);
            text-transform: uppercase;
            font-weight: 400;
            font-style: normal;
            padding: 0;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100vh;
        }

        .poster {
            width: 100%;
            height: calc(80vh - 40px);
            background-color: var(--pink);
            border: var(--size) solid var(--green);
            display: grid;
            grid-template-rows: auto 1fr auto;
            text-align: center;
            box-shadow: 0 0 0 30px var(--pink);
        }


        @media(min-width: 768px) {
            .poster {
                width: clamp(30vw, 50vw, 600px);
            }
        }
            .poster:hover {
                --green: transparent;
            }

        .poster__header, .poster__middle {
            border-bottom: var(--size) solid var(--green);
        }

        .orb-wrapper {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        .orb {
            width: 200px;
            height: 200px;
            border-radius: 100%;
            background-color: var(--pink);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 0 30px var(--green), 0 0 0 60px var(--pink), 0 0 0 90px var(--green), 0 0 0 120px var(--pink), 0 0 0 150px var(--green), 0 0 0 180px var(--pink), 0 0 0 210px var(--green);
            z-index: 10;
        }

            .orb::before {
                content: '';
                width: var(--size);
                height: 100vh;
                position: absolute;
                background-color: var(--pink);
                transform: translate(0, -50%) rotate(0deg);
                transform-origin: bottom;
                z-index: -1;
                animation: spin 10s linear infinite;
            }

        @keyframes spin {
            from {
                transform: translate(0, -50%) rotate(0deg);
            }

            to {
                transform: translate(0, -50%) rotate(360deg);
            }
        }
    </style>
</head>

<div class="poster-wrapper">
    <section class="poster">

        <div class="poster__header">
            <h1 class="poster__title">Keep on going</h1>
        </div>

        <div class="poster__middle">
            <div class="orb-wrapper">
                <div class="orb">
                    <h3 class="poster__subtitle">OR</h3>
                </div>
            </div>
        </div>

        <div class="poster__footer">
            <h1 class="poster__title">Don't.</h1>
        </div>

    </section>
</div>
